<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Open Agent Memory Inspector</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <main>
    <h1>Open Agent Memory Inspector</h1>
    <p>Enter a credential and authorized user to inspect the public API.</p>
    <form aria-describedby="credential-note">
      <label>API credential <input type="password" autocomplete="off" required></label>
      <p id="credential-note">The credential remains in page memory and is cleared on reload.</p>
      <label>User <input autocomplete="off" required></label>
      <button type="submit">Connect</button>
    </form>
    <section aria-live="polite"></section>
  </main>
</body>
</html>
