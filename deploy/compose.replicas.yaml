# Combine with compose.yaml; only the gateway publishes a host port.
services:
  api:
    ports: !reset []
    deploy:
      replicas: 2
  worker:
    deploy:
      replicas: 2
  gateway:
    image: nginx:stable-alpine
    ports:
      - 127.0.0.1:${OAM_HTTP_PORT:-17333}:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
