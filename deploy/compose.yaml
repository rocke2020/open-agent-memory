name: oam

x-model-environment: &models
  VLM_BASE_URL: ${VLM_BASE_URL:?Set VLM_BASE_URL}
  VLM_API_KEY: ${VLM_API_KEY:?Set VLM_API_KEY}
  VLM_MODEL: ${VLM_MODEL:?Set VLM_MODEL}
  OAM_EMBEDDING_URL: ${OAM_EMBEDDING_URL:?Set OAM_EMBEDDING_URL}
  OAM_EMBEDDING_KEY: ${OAM_EMBEDDING_KEY:?Set OAM_EMBEDDING_KEY}
  OAM_EMBEDDING_MODEL: ${OAM_EMBEDDING_MODEL:?Set OAM_EMBEDDING_MODEL}
  OAM_CONFIG: /etc/oam/operator.yaml

x-application: &application
  image: ${OAM_IMAGE:-ghcr.io/rocke2020/open-agent-memory:0.0.2}
  init: true
  stop_grace_period: 90s
  volumes:
    - ./oam.yaml:/etc/oam/operator.yaml:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg18
    shm_size: 256mb
    environment:
      POSTGRES_DB: oam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      OAM_API_DB_PASSWORD: ${OAM_API_DB_PASSWORD:?Set OAM_API_DB_PASSWORD}
      OAM_QUEUE_DB_PASSWORD: ${OAM_QUEUE_DB_PASSWORD:?Set OAM_QUEUE_DB_PASSWORD}
      OAM_CONTENT_DB_PASSWORD: ${OAM_CONTENT_DB_PASSWORD:?Set OAM_CONTENT_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./runtime-roles.sql:/bootstrap/runtime-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d oam"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *application
    profiles: [tools]
    command: [migrate]
    environment:
      OAM_CONFIG: /etc/oam/operator.yaml
      OAM_MIGRATION_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/oam
      OAM_ROOT_API_KEY: ${OAM_ROOT_API_KEY:?Set OAM_ROOT_API_KEY}

  api:
    <<: *application
    command: [api, --host, 0.0.0.0]
    environment:
      <<: *models
      OAM_API_DSN: postgresql://oam_api_login:${OAM_API_DB_PASSWORD:?Set OAM_API_DB_PASSWORD}@postgres:5432/oam
    ports:
      - 127.0.0.1:${OAM_HTTP_PORT:-17333}:17333
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:17333/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    <<: *application
    command: [worker]
    environment:
      <<: *models
      OAM_WORKER_QUEUE_DSN: postgresql://oam_queue_login:${OAM_QUEUE_DB_PASSWORD:?Set OAM_QUEUE_DB_PASSWORD}@postgres:5432/oam
      OAM_WORKER_CONTENT_DSN: postgresql://oam_content_login:${OAM_CONTENT_DB_PASSWORD:?Set OAM_CONTENT_DB_PASSWORD}@postgres:5432/oam

volumes:
  postgres-data:
