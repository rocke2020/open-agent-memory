# Public API contract version; only 0.0.1 is supported.
# Size comments use 1024-based KB and MB; numeric *_bytes values are in bytes.
contract_version: "0.0.1"

resource:
  # Resource abstracts and vision keep a separate completion budget from learned-memory extraction.
  max_output_tokens: 4096
  # Maximum original file size per Resource: 100 MB, combined when there are multiple images.
  max_bytes: 104857600
  # Total URL-fetch deadline, including DNS, connection and body transfer.
  url_fetch_timeout_seconds: 30
  # Kill isolated PDF processing if the child process exceeds this deadline.
  pdf_child_timeout_seconds: 30
  # Maximum physical pages accepted in one PDF Resource, including native-text pages.
  max_pdf_pages: 100
  # Maximum image originals per Resource; the public image upload currently accepts one image.
  max_images: 20
  # Maximum original image: 100 million pixels, e.g., 10000 x 10000; larger originals are rejected before full decoding.
  max_input_pixels_per_image: 100000000
  # Maximum vision copy or rendered PDF page: 40 million pixels, e.g., 8000 x 5000; larger images are downscaled.
  max_pixels_per_image: 40000000
  # Maximum total original-image or rendered-PDF pixels per Resource: 250 million; exceeding this rejects the Resource.
  # For example, 10 photos at 6000 x 4000 use 240 million pixels; 11 exceed the budget. Image-count and file-size limits also apply.
  max_total_pixels: 250000000

api:
  # Admission limits shared across API replicas; writes also consume request slots.
  max_concurrent_requests: 10
  max_concurrent_writes: 6
  # HTTP request-body cap, including upload framing: 128 MB.
  max_request_bytes: 134217728

# General counter for Profile budgets and source sizing without an embedding override.
# Extraction estimates keep their policy; recall uses fixed local o200k_base counting.
tokenizer:
  type: o200k_base

chunk:
  # Split each message/document into passages before indexing, in either extraction mode.
  # These are per-passage limits using the local token estimate, not batch group sizes.
  ingestion:
    # Soft packing target; complete paragraphs/sentences may exceed it within max.
    target_estimated_tokens: 2048
    # Maximum passage size measured with the local token estimate.
    max_estimated_tokens: 4096
    # Source spans never overlap, so each extracted fact has one owning passage.
    extractable_overlap_estimated_tokens: 0
    # The prior passage's tail is context only; it cannot support a new fact.
    previous_context_estimated_tokens: 128

extraction:
  # Shared input ceiling (estimated tokens) for L1 extraction and L2 Insight synthesis/repair.
  # Includes system instructions and the complete serialized input.
  max_input_tokens: 8192
  # Group planning estimates output as 3 * source tokens + 128 * passage count.
  # Multi-passage groups must fit this estimate and max_input_tokens; size is not fixed.
  group_max_estimated_output_tokens: 4096
  # Chat/Messages completion budget, leaving room for reasoning and visible JSON; Responses omits it.
  # This is separate from the group-planning estimate above.
  max_output_tokens: 64000
  # Maximum extracted facts in one model response, shared by all passages in the group.
  max_facts_per_group: 64
  # Adjacent eligible passages within one source share a bounded call by default.
  # This is a passage cap, not a turn count; 1 restores one call per passage.
  group_max_passages: 64
  # Existing-memory context is enabled by default; zero disables it.
  reference_max_facts: 10
  # Soft target for proportional reference previews; complete sentences/clauses may exceed it.
  # max_input_tokens remains the hard limit for the full model request.
  reference_max_input_tokens: 2048

search:
  # Per-query limit measured with the local token estimate.
  max_query_tokens: 512
  # Maximum queries in a batch or generated decomposition plan.
  max_queries: 4
  # Parallel searches within one batch request.
  query_concurrency: 2
  # Rank-fusion denominator offset: each arm contributes weight / (rrf_k + rank).
  rrf_k: 60
  # PostgreSQL ts_rank_cd expects D, C, B, A: content, caption, heading, title.
  # D applies to all indexed units; current HTML passages may also supply C/B/A.
  # Higher weights favor those structural fields when present.
  fts_rank_weights: [0.1, 0.2, 0.4, 1.0]
  # Supported query entities increase lexical relevance by at most this fraction.
  # Zero skips the stored-name lookup; names alone never outrank positive relevance.
  query_entity_boost: 0.5
  # Only normal uses these arm weights; fast uses equal fusion weights.
  normal_arm_weights:
    lexical: 1.0
    dense: 1.0
    # Entity, semantic, and causal neighbors are indirect evidence.
    # A 0.1 vote supports direct matches without letting graph noise lead the ranking.
    graph: 0.1
    temporal: 1.0
  # Only sufficiently similar dense fact hits become graph expansion seeds.
  graph_seed_min_similarity: 0.3
  # Maximum sufficiently similar dense fact hits used as graph-expansion seeds.
  graph_seed_max: 12
  # Outgoing causal expansion uses exactly two hops; only 2 is supported.
  relation_hops: 2
  # Maximum graph-arm results after entity, semantic, and causal expansion.
  relation_candidates: 32
  # Candidate facts examined for each entity shared with a seed.
  entity_candidates_per_entity: 200
  # Entity keys examined per graph seed.
  entities_per_seed: 8
  # Cap each semantic direction and causal hop at this many links.
  links_per_seed: 16
  # Maximum temporal seeds selected before spreading.
  temporal_seed_max: 10
  # Spread temporal seeds across the requested time window.
  temporal_coverage_buckets: 8
  # Maximum neighbors visited from each temporal node.
  temporal_neighbors: 10
  # Maximum temporal node pool; fast also caps it by max_results.
  temporal_nodes: 300
  # Minimum query similarity for a fact reached through temporal links.
  temporal_semantic_floor: 0.1
  # pgvector HNSW settings for dense search; strict_order preserves distance order.
  ann_iterative_scan: strict_order
  # Upper bound on tuples visited by iterative ANN scans.
  ann_scan_max_tuples: 20000
  # Per mode: channel_candidates caps each arm; fused_candidates caps rank fusion.
  # rerank_candidates caps optional normal-mode reranking; fast never calls a reranker.
  # source_seed_results caps fact/original seeds and recovered user originals.
  # max_results caps each learned-text and original-text pool independently.
  # The combined response can contain up to twice this many items.
  # graph: off skips entity/alias expansion, light uses identities, full adds
  # semantic neighbors. causal_graph independently enables outgoing causal
  # links, including within temporal retrieval. Quote "off" in YAML.
  # user_fact_exchange keeps direct dense and strict lexical hits; other memory
  # matches need a dense user fact in their user/immediate-assistant exchange.
  # Partial assistant replies use only the first source_seed_results dense hits
  # for both a user fact and its exact cited original; user roots and optional
  # user context keep their existing scope. whole_query uses one OR FTS ranking;
  # per_term retains term-list fusion. Neither ranking uses a scoring model.
  # Optional neighbors keep sentence spans first, then clauses, up to max_chars.
  # Use the previous user's tail / next user's head; cited originals stay complete.
  fast:
    context_max_tokens: 18000
    graph: "off"
    causal_graph: false
    lexical_ranking: whole_query
    partial_match_gate: user_fact_exchange
    adjacent_user_context: true
    adjacent_user_context_max_chars: 1000
    channel_candidates: 64
    fused_candidates: 128
    rerank_candidates: null
    source_seed_results: 36
    max_results: 96
  normal:
    context_max_tokens: 32768
    graph: light
    causal_graph: false
    lexical_ranking: per_term
    partial_match_gate: "off"
    adjacent_user_context: false
    adjacent_user_context_max_chars: 1000
    channel_candidates: 64
    fused_candidates: 154
    rerank_candidates: 48
    source_seed_results: 36
    max_results: 154

index:
  # Extract and store explicit causal links; recall opts in independently per mode.
  enable_causal_graph: false
  # Maximum UTF-8 bytes for both the original entity name and its normalized lookup key.
  entity_name_max_bytes: 1024
  # Maximum existing entities proposed by name matching for extraction references.
  entity_resolution_candidates: 32
  # Supported names/aliases offered per entity during candidate selection and reference assembly.
  entity_search_names_per_entity: 4
  # Entity-name rank normalization: 0 = none, 1 = divide by 1 + log(name length),
  # 2 = divide by name length; length is indexed text length, not UTF-8 bytes.
  entity_search_rank_normalization: 0
  # L2 Insight synthesis is independently configurable; Profile may consume L2 when enabled.
  insights_enabled: true
  # Delay in hours from completed source indexing to newly queued L2 consolidation.
  insight_consolidation_delay_hours: 24
  # Parallel independent Insight groups within one owned consolidation job.
  insight_generation_concurrency: 1
  # Related groups preserve cosine clustering; source batches protect ranked targets per seed.
  insight_seed_policy: related
  # Optional per-interaction-source/version/generation allowance for L1 and L2 together.
  # Reservations use full text-request UTF-8 bytes plus the output ceiling, never refunded.
  # Profile, embeddings and document Resources are separate; null leaves the guard disabled.
  generation_token_budget: null
  # Optional source-batch-only seed, full-input token and combined target caps.
  # Set all three together: {seed_max: 32, input_max_tokens: 32768, target_max: 64}.
  # Null preserves the shared limits below; per-seed target lookup keeps its own cap.
  insight_source_batch: null
  # L2 input uses extraction.max_input_tokens above, shared with L1 extraction.
  # Maximum related new facts and existing complete Insight bodies per L2 request.
  insight_seed_max: 8
  insight_candidate_max: 8
  # Dedicated L2 completion ceiling, including provider reasoning tokens.
  insight_max_output_tokens: 64000
  # Vector length required from the embedding model; must match the database schema.
  embedding_dimensions: 1024
  # Create index-time semantic links only above this cosine similarity.
  semantic_link_min_similarity: 0.7
  # Maximum outgoing semantic neighbors stored per fact, including existing links.
  semantic_link_max_neighbors: 20
  # Index-time semantic-link ANN scan mode, independent of recall; only strict_order is supported.
  semantic_link_ann_iterative_scan: strict_order
  # Maximum tuples visited by each index-time semantic-link ANN scan.
  semantic_link_ann_scan_max_tuples: 20000
  # Maximum temporal neighbors selected per new fact for each time basis.
  temporal_link_max_neighbors: 20
  # Only facts within this many seconds can receive temporal links at indexing.
  temporal_link_horizon_seconds: 86400

recall:
  # Shared trusted-turn deadline; the mode deadline also applies to each request.
  turn_deadline_seconds: 10
  # Maximum fast-search duration; caller and trusted-turn deadlines may shorten it.
  fast_deadline_seconds: 3
  # Maximum normal-search duration; caller and trusted-turn deadlines may shorten it.
  normal_deadline_seconds: 5

profile:
  enabled: true
  # Complete input budget counted with the configured tokenizer.
  max_input_tokens: 49152
  # Selected memory evidence and provenance, separate from instructions and exact fields.
  max_memory_tokens: 32768
  # Stored Profile content budget for read/unchanged responses, using the local token estimate.
  max_response_tokens: 18000
  # Maximum accepted UTF-8 Profile content: 16 KB; separate from the model's token cap.
  max_content_bytes: 16384
  # Completion-token cap for Profile refresh generation.
  max_output_tokens: 4096
  # Per-call generation timeout for Profile refresh, overriding model.attempt_timeout_seconds.
  attempt_timeout_seconds: 180

planner:
  # Decompose-and-search permits at most one generative planner call; only 1 is supported.
  max_calls: 1
  # Planner input budget, including instructions and the question; not an output limit.
  max_context_tokens: 2048

request:
  # One shared deadline for all searches in a search-many request.
  batch_deadline_seconds: 10
  # One shared deadline for planning and all resulting searches in decompose-and-search.
  delegated_deadline_seconds: 10

model:
  # Default model-call timeout, including capacity wait; request deadlines may shorten it.
  attempt_timeout_seconds: 600

retry:
  # Total durable work attempts, including the first attempt; not extra retries per model call.
  max_attempts: 3

worker:
  # Run a worker inside the API process when enabled.
  embedded_enabled: true
  # Limit running work items separately from simultaneous model calls.
  max_tasks: 10
  # Closed imports can hold queued semantic work until their declared facts are ready.
  claim_semantic_links: true

lease:
  # Work-claim lifetime unless renewed by worker heartbeats.
  seconds: 90
  # Interval between worker claim renewals.
  heartbeat_seconds: 20
  # Time to wait for in-flight tasks during worker shutdown.
  shutdown_seconds: 90

database:
  # Environment-variable names holding DSNs for schema migrations and API access.
  migration_dsn_env: OAM_MIGRATION_DSN
  api_dsn_env: OAM_API_DSN
  # Worker queue admission and content access use separate database roles.
  worker_queue_dsn_env: OAM_WORKER_QUEUE_DSN
  worker_content_dsn_env: OAM_WORKER_CONTENT_DSN
  # Maximum PostgreSQL connections in each API process's pool, not across the deployment.
  api_pool_max: 10
  # Minimum connections kept by each process-local pool.
  pool_min_size: 1
  # Per-worker queue/content pool capacity; worker pools use separate database roles.
  worker_pool_max: 10
  # Maximum time a long-lived process waits for a pooled PostgreSQL connection.
  pool_acquire_timeout_seconds: 5
  # Limit indexing database transactions across replicas.
  indexing_concurrency: 4
  # Physical vector policy: small=shared HNSW, large=per-user HNSW,
  # growing=provision per-user HNSW after the row threshold. Never changes extraction identity.
  vector_index_mode: small
  # Initial provisioning policy, not a measured performance crossover.
  vector_index_min_rows: 10000
  # Privileged vector-index maintenance interval; content roles cannot run DDL.
  vector_index_poll_seconds: 900

auth:
  # Authentication mode: dev, api_key or trusted; null selects from root-key/bootstrap state.
  mode: null
  # Environment variable holding the root API credential for bootstrap and administration.
  root_key_env: OAM_ROOT_API_KEY
  # Process-local credential-cache lifetime; bounds cached revocation delay.
  cache_ttl_seconds: 30
  # Maximum credentials retained in each process-local cache.
  cache_max_entries: 4096
  # Default and maximum page size for credential-listing requests.
  credential_page_size: 50

ingest:
  # Maximum combined UTF-8 message content per interaction retain request: 128 KB; excludes JSON structure and metadata.
  max_bytes: 131072
  # Maximum messages accepted in one interaction retain request.
  max_messages: 128

queue:
  # Pending root work per user, shared across replicas; dependent child work is not counted.
  max_pending_per_user: 1000

provider:
  # Simultaneous generative model calls admitted across replicas.
  llm_concurrency: 32
  # Simultaneous embedding calls admitted across replicas.
  embedding_concurrency: 8
  # Keep this many embedding permits available to foreground search.
  embedding_search_reserved: 0
  # Simultaneous reranker calls per model-client instance; no shared deployment permit.
  rerank_concurrency: 4

user:
  # Reserved per-user report-count limit; not currently enforced.
  max_reports: 100
  # Reserved per-user chat-count limit; not currently enforced.
  max_chats: 1000
  # Concurrent worker claims allowed for one user, across replicas.
  concurrency: 2

trace:
  # Age after which recorded context and replay artifacts are unavailable; no automatic purge.
  content_retention_days: 7
  # Lifetime of the trace record for lookup; no automatic database deletion.
  metadata_retention_days: 30

evidence:
  # Reserved default Evidence retention policy; automatic expiry is not implemented.
  default_retention_days: 365

audit:
  # Reserved audit-record retention policy; automatic expiry is not implemented.
  retention_days: 90

export:
  # Download/access lifetime of a generated export; expiry does not purge stored parts.
  retention_hours: 24

backup:
  # Reserved backup retention policy; OAM does not yet create or expire backups automatically.
  retention_days: 30

models:
  # Every generative role uses this shared VLM binding.
  vlm:
    # Generative protocol: openai_chat, openai_responses or anthropic_messages.
    protocol: openai_chat
    # legacy_chat preserves existing requests; effort sends protocol-native effort; provider_default omits controls.
    reasoning_mode: legacy_chat
    # Chat-only extension: null omits it; true and false are sent exactly.
    reasoning_split: null
    # Environment variable holding the shared generative model identifier.
    model_env: VLM_MODEL
    # Environment variable holding the protocol base URL; see docs/operations.md for path rules.
    endpoint_env: VLM_BASE_URL
    # Environment variable holding the API credential.
    api_key_env: VLM_API_KEY
    # Declared model capabilities validated against enabled generative roles.
    capabilities: [text, vision]
  # Role effort; null disables the role. Its wire meaning depends on reasoning_mode.
  reasoning_effort:
    # Reasoning setting for source-backed fact extraction.
    extraction: low
    # Reasoning setting for L2 Insight synthesis.
    insights: low
    # Reasoning setting for Resource abstract generation.
    abstract: low
    # Reasoning setting for explicit Profile refresh generation.
    profile: low
    # Reasoning setting for query decomposition; null disables this role.
    planner: null
  embedding:
    # Optional query-only encoder instruction, including syntax and trailing separator.
    # Source sizing and final embedding inputs use this override, or the general counter.
    # A counter is only model-matched when verified against the selected deployment.
    tokenizer: null
    max_input_tokens: null
    max_request_tokens: null
    max_request_items: null
    # Document embeddings and the complete original query remain unchanged.
    query_prefix: ""
    # Embedding wire protocol; only OpenAI-compatible embeddings is supported.
    protocol: openai_compatible
    # Environment variable holding the embedding model identifier.
    model_env: OAM_EMBEDDING_MODEL
    # Environment variable holding the API base URL; /embeddings is appended.
    endpoint_env: OAM_EMBEDDING_URL
    # Environment variable holding the required Bearer API credential.
    api_key_env: OAM_EMBEDDING_KEY
    # Declared capabilities; embedding roles require embeddings.
    capabilities: [embeddings]
  # null disables the optional reranking stage; a binding enables it for normal search.
  reranker: null
