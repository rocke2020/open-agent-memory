name: MCP package

on:
  pull_request:
    paths:
      - integrations/mcp/**
      - .github/workflows/mcp.yaml
  push:
    branches:
      - main
    paths:
      - integrations/mcp/**
      - .github/workflows/mcp.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/mcp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Test package
        run: npm test
      - name: Check package contents
        run: npm pack --dry-run
