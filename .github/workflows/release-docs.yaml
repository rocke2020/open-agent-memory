name: Release documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release documentation gate
        run: |
          python -m pip install 'pytest>=8.4'
          python -m pytest -q tests/unit/test_release_docs.py
      - name: Check release notes and documentation review
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag and project version disagree"; exit 1; }
            base=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^)
            python tools/check_release_docs.py --base "$base" --require-review
          elif [[ -n "$PR_BASE" ]]; then
            python tools/check_release_docs.py --base "$PR_BASE"
          else
            python tools/check_release_docs.py
          fi
